name: modular-monolith-cq-symfony

services:

  php-api:
    build:
      context: docker
      target: dev
    image: local-php-api-symfony
    restart: unless-stopped
    depends_on:
      - database
    volumes:
      - .:/app:rw
      - vendor:/app/vendor
      - var:/app/var
    ports:
      - '${APP_PORT:-86}:8000'
    environment:
      DB_HOST: database
      DB_DATABASE: $DB_DATABASE
      DB_USER: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      COMPOSER_HOME: /home/www-data/.composer
    command: ["/bin/sh", "-c", "/app/start-app.sh dev ; sleep 36000"]

  database:
    image: mariadb:12.2-ubi
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: $DB_PASSWORD
      MARIADB_ROOT_HOST: '%'
      MARIADB_DATABASE: $DB_DATABASE
      MARIADB_USER: $DB_USER
      MARIADB_PASSWORD: $DB_PASSWORD
      MARIADB_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - mysql:/var/lib/mysql:rw
      - ./docker/test_db_init.sql:/docker-entrypoint-initdb.d/test_db_init.sql:ro
    ports:
      - '${FORWARD_DB_PORT:-63306}:3306'

volumes:
  mysql:
  vendor:
  var:
