nelmio_api_doc:
    documentation:
        info:
            title: MM-CQ-Symfony
            description: Modular monolith with Command & Query
            version: "0.1"
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
        security:
            -   Bearer: [ ]
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
